name: xianyu-gateway

on:
  push:
    paths:
      - "xianyu-gateway/**"
      - ".github/workflows/xianyu-gateway.yml"
  pull_request:
    paths:
      - "xianyu-gateway/**"
      - ".github/workflows/xianyu-gateway.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xianyu-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: End-to-end test
        run: python tests/e2e_local.py
      - name: Build image
        run: docker build -t xianyu-gateway:ci .
